function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function resultRowsHtml(list){return list.length?list.map(r=>`<tr><td><div class="student"><span class="avatar">${esc((r.name||'?').split(' ').slice(-1)[0].slice(0,1))}</span>${esc(r.name||'')}</div></td><td>${esc(r.class||'—')}<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.year||'—')}</div></td><td>${esc(r.exam||'—')}<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.subject||'')}</div></td><td><strong style="color:${r.status==='Đã nộp'?'var(--site-primary)':'#a0a8b8'}">${r.status==='Đã nộp'?Number(r.score).toLocaleString('vi-VN')+'/10':'—'}</strong>${r.status==='Đã nộp'?`<div class="muted" style="font-size:10px;margin-top:3px">${r.pass===false?'Chưa đạt':r.pass===true?'Đạt':''}</div>`:''}</td><td>${r.duration?Number(r.duration)+' phút':'—'}<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.date||'')}</div></td><td>${pill(r.status||'Chưa làm')}</td><td><button class="btn" data-action="student-detail" data-id="${r.id}">Hồ sơ</button> <button class="btn" data-action="print-slip" data-id="${r.id}">In phiếu</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">Không có kết quả phù hợp với điều kiện đã chọn.</div></td></tr>'}
function getFilteredResults(){
 const val=id=>($('#'+id)?.value||''); const q=val('resultSearch').trim().toLocaleLowerCase('vi');

 return (!val('resultYear')||r.year===val('resultYear'))&&(!val('resultClass')||r.class===val('resultClass'))&&(!val('resultSubject')||r.subject===val('resultSubject'))&&(!val('resultExam')||r.exam===val('resultExam'))&&(!q||(r.name||'').toLocaleLowerCase('vi').includes(q))&&(!val('resultStatus')||r.status===val('resultStatus'))&&scoreOk})

 const cards=[['Bản ghi phù hợp',list.length,'Theo bộ lọc hiện tại'],['Đã nộp',submitted.length,'Lượt làm bài hoàn tất'],['Chưa làm',notDone,'Cần theo dõi'],['Điểm trung bình',submitted.length?avgScore.toFixed(2):'—',submitted.length?'Trên thang 10':'Chưa có điểm đã nộp']];

function classesPage(){let cls=['9A1','9A2'];return `<div class="heading-row"><div><div class="eyebrow">Báo cáo tổng hợp</div><h1>Thống kê lớp học</h1><div class="muted">So sánh số lượt nộp, điểm trung bình và phân bố kết quả theo lớp.</div></div><button class="btn primary" data-action="export-classes">⇩ Xuất thống kê CSV</button></div><section class="panel"><div class="panel-head"><div><h2>So sánh kết quả giữa các lớp</h2><div class="panel-sub">Tổng hợp từ tất cả bài kiểm tra mẫu đã ghi nhận</div></div><select id="classExamFilter"><option value="">Tất cả bài kiểm tra</option>${[...new Set(results.map(r=>r.exam))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Lớp</th><th>Lượt nộp</th><th>Chưa làm</th><th>Điểm TB</th><th>Cao nhất</th><th>Thấp nhất</th><th>Tỷ lệ 7+</th></tr></thead><tbody id="classRows">${classRowsHtml('')}</tbody></table></div></section><div class="two-col"><section class="panel"><h2>Điểm trung bình theo lớp</h2><div class="panel-sub">Điểm trên thang 10</div><div id="classBars">${classBarsHtml('')}</div></section><section class="panel"><h2>Phân bố điểm toàn bộ</h2><div class="panel-sub">Chỉ tính lượt đã nộp</div>${[['Dưới 5',results.filter(r=>r.status==='Đã nộp'&&r.score<5).length],['5 – dưới 7',results.filter(r=>r.status==='Đã nộp'&&r.score>=5&&r.score<7).length],['7 – dưới 9',results.filter(r=>r.status==='Đã nộp'&&r.score>=7&&r.score<9).length],['9 – 10',results.filter(r=>r.status==='Đã nộp'&&r.score>=9).length]].map(([l,n])=>`<div class="barrow"><span>${l}</span><div class="bartrack"><div class="barfill" style="width:${n/Math.max(1,results.filter(r=>r.status==='Đã nộp').length)*100}%"></div></div><strong>${n}</strong></div>`).join('')}</section></div>`}
function classRowsHtml(exam){return ['9A1','9A2'].map(c=>{let all=results.filter(r=>r.class===c&&(!exam||r.exam===exam)),s=statsFor(all);return `<tr><td><strong>${c}</strong></td><td>${s.done.length}</td><td>${all.filter(r=>r.status!=='Đã nộp').length}</td><td><strong>${s.mean.toFixed(1)}</strong></td><td>${s.hi.toFixed(1)}</td><td>${s.lo.toFixed(1)}</td><td>${s.done.length?(s.done.filter(r=>r.score>=7).length/s.done.length*100).toFixed(0)+'%':'—'}</td></tr>`}).join('')}

function settingsPage(){return `<div class="heading-row"><div><div class="eyebrow">Cấu hình</div><h1>Thông tin kỳ thi</h1><div class="muted">Thông tin mặc định hiển thị trong không gian làm việc mẫu.</div></div></div><section class="panel"><div class="panel-head"><div><h2>Thông tin nhà trường và năm học</h2><div class="panel-sub">Các trường dưới đây được lưu trong trình duyệt hiện tại.</div></div></div><form id="settingsForm"><div class="formgrid"><div class="field"><label>Tên đơn vị</label><input name="school" value="${esc(appSettings.school||'Trường TH&THCS Tây Sơn')}" required></div><div class="field"><label>Năm học</label><select name="year"><option>2026–2027</option><option>2025–2026</option><option>2027–2028</option></select></div><div class="field"><label>Người quản lý</label><input name="manager" value="${esc(appSettings.manager||'Giáo viên bộ môn / GVCN')}"></div><div class="field"><label>Môn học mặc định</label><select name="subject"><option>Toán</option><option>Ngữ văn</option><option>Tiếng Anh</option><option>Tin học</option><option>Khoa học tự nhiên</option><option>Lịch sử và Địa lí</option></select></div></div><div style="margin-top:18px"><button class="btn primary">Lưu thông tin</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>Sao lưu và khôi phục dữ liệu</h2><div class="panel-sub">Tạo bản sao dữ liệu đề kiểm tra, kết quả và cài đặt đang lưu trên trình duyệt này.</div></div></div><div class="filters"><button class="btn primary" id="backupExport">⇩ Tải bản sao lưu JSON</button><label class="btn" for="backupImportFile" style="cursor:pointer">⇧ Khôi phục từ JSON</label><input id="backupImportFile" type="file" accept=".json,application/json" hidden><button class="btn danger" id="clearAllData">Xóa dữ liệu đã lưu</button></div><div class="notice">⚠️ Tệp sao lưu có thể chứa thông tin học sinh. Hãy lưu ở nơi an toàn. Khôi phục sẽ thay thế dữ liệu hiện tại. Đây chỉ là sao lưu cục bộ, chưa đồng bộ lên máy chủ.</div></section><section class="panel"><h2>Những tính năng của bản xem trước</h2><div class="quick-grid" style="margin-top:16px"><div class="quick"><div class="quick-icon">🧾</div><strong>Tạo và chỉnh sửa đề</strong><span>Nhập tiêu đề, môn, lớp, năm học, thời gian, lịch mở/đóng và câu hỏi trắc nghiệm.</span></div><div class="quick"><div class="quick-icon">⏱️</div><strong>Làm bài có tính giờ</strong><span>Học sinh nhập thông tin, chọn đáp án, nộp bài và xem điểm minh họa.</span></div><div class="quick"><div class="quick-icon">📊</div><strong>Thống kê và xuất dữ liệu</strong><span>Lọc kết quả theo học sinh, lớp, đề thi và tải CSV mở bằng Excel.</span></div></div><div class="notice">🔐 Để dùng chính thức cần bổ sung đăng nhập/phân quyền, cơ sở dữ liệu, chấm tự luận, chống gian lận và lưu bài an toàn. Không dùng dữ liệu mẫu làm sổ điểm thật.</div></section>`}
function bindPage(){ $$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));let es=$('#examSearch'),st=$('#examStatus');if(es) [es,st].forEach(x=>x.addEventListener('input',()=>{let list=exams.filter(e=>(!es.value||(e.title+' '+e.subject).toLowerCase().includes(es.value.toLowerCase()))&&(!st.value||e.status===st.value));$('#examList').innerHTML=examListHtml(list);bindActionsOnly()}));if($('#resultSearch')){['resultSearch','resultYear','resultClass','resultSubject','resultExam','resultStatus','resultScoreBand'].forEach(id=>{const el=$('#'+id);el.addEventListener('input',updateResultView);el.addEventListener('change',updateResultView)});$('#applyResultFilters').onclick=updateResultView;$('#resetResultFilters').onclick=()=>{['resultSearch','resultYear','resultClass','resultSubject','resultExam','resultStatus','resultScoreBand'].forEach(id=>$('#'+id).value='');updateResultView()};updateResultView()}let cf=$('#classExamFilter');if(cf)cf.onchange=()=>{$('#classRows').innerHTML=classRowsHtml(cf.value);$('#classBars').innerHTML=classBarsHtml(cf.value)};let sf=$('#settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();appSettings=Object.fromEntries(new FormData(sf).entries());persistState();toast('Đã lưu thông tin trên trình duyệt này.')};const be=$('#backupExport');if(be)be.onclick=exportBackup;const bi=$('#backupImportFile');if(bi)bi.onchange=importBackup;const ca=$('#clearAllData');if(ca)ca.onclick=confirmClearData;}

function action(a,id){let e=exams.find(x=>x.id===Number(id));if(a==='new-exam'||a==='edit-exam')openExamForm(e);if(a==='import-exam')openImportForm();if(a==='print-slip'){printScoreSlip(id);return}if(a==='duplicate-exam'){if(!e){toast('Không tìm thấy đề cần nhân bản.');return}const copy=structuredClone(e);copy.id=nextExam++;copy.title=e.title+' (Bản sao)';copy.status='Bản nháp';exams.unshift(copy);persistState();render();toast('Đã nhân bản đề thành bản nháp để chỉnh sửa.')}if(a==='copy-link'){if(!e){toast('Không tìm thấy đề kiểm tra.');return}const u=new URL(window.location.href);u.searchParams.set('mode','student');u.searchParams.set('exam',String(e.id));showLink(u.toString())}if(a==='toggle-exam'){e.status=e.status==='Đang mở'?'Đã đóng':'Đang mở';persistState();render();toast('Đã cập nhật trạng thái đề.')}if(a==='delete-exam'){showModal(`<div class="modal-head"><div><h2>Xóa đề kiểm tra?</h2><div class="muted">Bạn có chắc muốn xóa “${esc(e.title)}” khỏi dữ liệu mẫu?</div></div><button class="xbtn" data-close>×</button></div><div class="modal-footer"><button class="btn" data-close>Hủy</button><button class="btn danger" id="confirmDelete">Xóa đề</button></div>`);$('#confirmDelete').onclick=()=>{exams=exams.filter(x=>x.id!==e.id);persistState();closeModal();render();toast('Đã xóa đề khỏi trình duyệt này.')}}if(a==='student-detail'){let r=results.find(x=>x.id===Number(id));showModal(`<div class="modal-head"><div><div class="eyebrow">Hồ sơ kết quả</div><h2>${esc(r.name)}</h2><div class="muted">Lớp ${esc(r.class)} · Năm học ${esc(r.year)}</div></div><button class="xbtn" data-close>×</button></div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><div class="stat-top">Điểm số</div><div class="stat-value">${r.status==='Đã nộp'?r.score:'—'}</div></div><div class="stat"><div class="stat-top">Thời gian</div><div class="stat-value">${r.duration||'—'}<span style="font-size:12px"> phút</span></div></div><div class="stat"><div class="stat-top">Câu đúng</div><div class="stat-value">${r.status==='Đã nộp'?r.correct+'/'+r.total:'—'}</div></div></div><p><b>Bài kiểm tra:</b> ${esc(r.exam)}</p><p><b>Trạng thái:</b> ${pill(r.status)}</p><p><b>Ngày nộp:</b> ${esc(r.date)}</p><div class="modal-footer"><button class="btn" data-close>Đóng</button></div>`)}if(a==='export-results'){const data=(page==='results'&&filteredResultsForExport.length?filteredResultsForExport:page==='results'?[]:results).map(r=>({HoTen:r.name,Lop:r.class,NamHoc:r.year,BaiKiemTra:r.exam,Mon:r.subject,Diem:r.status==='Đã nộp'?r.score:'',ThoiGianPhut:r.duration,TrangThai:r.status,SoCauDung:r.correct,SoCau:r.total,NgayNop:r.date}));exportCsv('ket_qua_hoc_sinh.csv',data)};if(a==='export-classes')exportCsv('thong_ke_lop.csv',['9A1','9A2'].map(c=>{let all=results.filter(r=>r.class===c),s=statsFor(all);return {Lop:c,LuotNop:s.done.length,ChuaLam:all.filter(r=>r.status!=='Đã nộp').length,DiemTrungBinh:s.mean.toFixed(2),DiemCaoNhat:s.hi,DiemThapNhat:s.lo}}))}
function downloadBlob(name,content,type='application/json;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){const payload={format:'EduTest-backup',version:1,createdAt:new Date().toISOString(),exams,results,nextExam,nextResult,settings:appSettings};downloadBlob('EduTest_sao_luu_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2));toast('Đã tạo tệp sao lưu JSON. Hãy lưu tệp ở nơi an toàn.')}
function importBackup(ev){const file=ev.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result||''));if(data.format!=='EduTest-backup'||!Array.isArray(data.exams)||!Array.isArray(data.results))throw new Error('Cấu trúc tệp không hợp lệ');showModal(`<div class="modal-head"><div><h2>Khôi phục dữ liệu?</h2><div class="muted">Tệp có ${data.exams.length} đề và ${data.results.length} bản ghi kết quả. Thao tác này sẽ thay thế dữ liệu đang lưu trên trình duyệt.</div></div><button class="xbtn" data-close>×</button></div><div class="notice">Nên tải bản sao lưu hiện tại trước khi tiếp tục.</div><div class="modal-footer"><button class="btn" data-close>Hủy</button><button class="btn primary" id="confirmRestore">Khôi phục dữ liệu</button></div>`);$('#confirmRestore').onclick=()=>{exams=data.exams;results=data.results;nextExam=Number(data.nextExam)||Math.max(0,...exams.map(x=>Number(x.id)||0))+1;nextResult=Number(data.nextResult)||Math.max(0,...results.map(x=>Number(x.id)||0))+1;appSettings=data.settings||{};persistState();closeModal();setPage('dashboard');toast('Đã khôi phục dữ liệu từ tệp sao lưu.')};}catch(err){toast('Không thể đọc tệp sao lưu: '+err.message)}finally{ev.target.value=''}};reader.readAsText(file)}
function confirmClearData(){showModal(`<div class="modal-head"><div><h2>Xóa dữ liệu đã lưu?</h2><div class="muted">Xóa toàn bộ đề, kết quả và cài đặt trong trình duyệt này. Không thể hoàn tác nếu chưa sao lưu.</div></div><button class="xbtn" data-close>×</button></div><div class="modal-footer"><button class="btn" data-close>Hủy</button><button class="btn danger" id="confirmClearAll">Xóa dữ liệu</button></div>`);$('#confirmClearAll').onclick=()=>{exams=[];results=[];nextExam=1;nextResult=1;appSettings={};persistState();closeModal();setPage('dashboard');toast('Đã xóa dữ liệu trên trình duyệt này.')}}
function showLink(link){showModal(`<div class="modal-head"><div><h2>Liên kết mở cổng học sinh</h2><div class="muted">Liên kết mở trang này ở chế độ học sinh và chọn đề tương ứng. Đây vẫn là bản thử: dữ liệu đề/kết quả chưa đồng bộ giữa các thiết bị.</div></div><button class="xbtn" data-close>×</button></div><input style="width:100%" id="linkText" value="${esc(link)}" readonly><div class="modal-footer"><button class="btn" data-close>Đóng</button><button class="btn primary" id="copyText">Sao chép liên kết</button></div>`);$('#copyText').onclick=async()=>{let i=$('#linkText');try{await navigator.clipboard.writeText(link);toast('Đã sao chép liên kết.')}catch{i.select();try{document.execCommand('copy');toast('Đã sao chép liên kết.')}catch{toast('Hãy chọn và sao chép liên kết thủ công.')}}closeModal()}}
function openImportForm(){
 showModal(`<div class="modal-head"><div><div class="eyebrow">Nhập học liệu</div><h2>Tải đề kiểm tra lên</h2><div class="muted">Chọn tệp Word/PDF hoặc dán đường dẫn. Hệ thống sẽ trích xuất nội dung để tạo bản nháp.</div></div><button class="xbtn" data-close>×</button></div>
 <div class="import-drop"><div style="font-size:30px">📄</div><b>Chọn đề từ máy tính</b><div class="muted">Hỗ trợ .docx, .pdf, .txt</div><input id="importFile" type="file" accept=".docx,.pdf,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"></div>

 <div id="importStatus" class="muted">Định dạng gợi ý: Câu 1. Nội dung câu hỏi; A. ... B. ... C. ... D. ...; Đáp án: B.</div>

 let extracted='';
 const status=$('#importStatus'), preview=$('#importPreview'), create=$('#createImported');
 function setText(t){extracted=(t||'').trim();preview.style.display='block';preview.textContent=extracted.slice(0,9000)||( 'Không trích xuất được văn bản. Nếu PDF là ảnh scan, cần OCR trước.');create.disabled=!extracted;status.textContent=extracted?'Đã đọc '+extracted.length+' ký tự. Kiểm tra phần xem trước trước khi tạo đề.':'Chưa trích xuất được văn bản.'}
 async function loadScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Không tải được thư viện xử lý tài liệu. Kiểm tra kết nối Internet.'));document.head.appendChild(s)})}
 $('#readImport').onclick=async()=>{
  const f=$('#importFile').files[0];if(!f){toast('Hãy chọn một tệp Word, PDF hoặc TXT.');return}

 };
 $('#fetchImport').onclick=async()=>{

   const res=await fetch(parsed.href);if(!res.ok)throw new Error('Trang nguồn không cho phép truy cập trực tiếp.');
   const type=res.headers.get('content-type')||'';
   if(type.includes('pdf')){const data=await res.arrayBuffer();if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++){let pg=await pdf.getPage(i);let c=await pg.getTextContent();pages.push(c.items.map(x=>x.str).join(' '))}setText(pages.join('\\n'))}
   else if(type.includes('word')||parsed.pathname.toLowerCase().endsWith('.docx')){const data=await res.arrayBuffer();if(!window.mammoth)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js');setText((await mammoth.extractRawText({arrayBuffer:data})).value)}
   else{const raw=await res.text();setText(raw.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&'))}
  }catch(err){status.textContent='Không lấy được link trực tiếp. Máy chủ có thể chặn truy cập từ website (CORS) hoặc yêu cầu đăng nhập. Hãy tải tệp về máy rồi chọn tệp ở phía trên.';toast('Không thể lấy link trực tiếp; hãy tải tệp lên.')}

 create.onclick=()=>{

 };

function makeFeedback(score,correct,total){
  const pct=total?correct/total:0;
  let strength=pct>=.85?'Em nắm vững phần lớn kiến thức, trả lời chính xác nhiều câu hỏi.':pct>=.6?'Em đã nắm được một số kiến thức trọng tâm và hoàn thành được phần lớn yêu cầu cơ bản.':'Em đã có cố gắng tham gia bài kiểm tra; cần củng cố thêm kiến thức nền tảng.';
  let improve=pct>=.85?'Tiếp tục luyện các câu vận dụng, trình bày lời giải cẩn thận và kiểm tra lại kết quả.':pct>=.6?'Ôn lại các câu trả lời chưa đúng, ghi nhớ kiến thức trọng tâm và luyện thêm bài tập cùng dạng.':'Cần ôn lại lý thuyết theo từng nội dung, làm bài tập cơ bản từng bước và trao đổi với giáo viên khi chưa hiểu.';
  return {strength,improve};
}
function dateLong(dateText){
  const d=new Date(dateText||Date.now());
  if(Number.isNaN(d.getTime())) return new Date().toLocaleDateString('vi-VN');
  return d.toLocaleDateString('vi-VN');
}

function submitQuiz(auto){clearInterval(quizTimer);let e=activeQuiz,form=$('#quizForm'),correct=0,total=Math.min(e.questions,e.items.length);for(let i=0;i<total;i++){let sel=form?.querySelector(`input[name="q${i}"]:checked`);if(sel&&Number(sel.value)===e.items[i].ans)correct++}let duration=Math.max(1,Math.round((Date.now()-quizStart)/60000)),score=Math.round(correct/Math.max(1,total)*10*10)/10;let passScore=Number(e.passScore??5);let r={id:nextResult++,name:quizStudent.name,class:quizStudent.class,year:e.year,exam:e.title,subject:e.subject,score,duration,status:'Đã nộp',date:new Date().toLocaleDateString('vi-VN'),correct,total,passScore,pass:score>=passScore};
const autoFeedback=makeFeedback(score,correct,total);r.strength=autoFeedback.strength;r.improve=autoFeedback.improve;
results.unshift(r);persistState();activeQuiz=null;$('#main').innerHTML=`<div class="student-shell"><section class="panel" style="text-align:center;padding:32px 20px"><div style="font-size:48px">🎉</div><div class="eyebrow" style="margin-top:14px">${auto?'Đã tự động nộp bài':'Nộp bài thành công'}</div><h1 style="font-size:27px;margin:0 0 8px">Bài làm đã được ghi nhận!</h1><div class="muted">${esc(quizStudent.name)} · ${esc(quizStudent.class)} · ${esc(e.title)}</div><div class="result-score" style="margin-top:18px">${score}<span style="font-size:18px;color:light-dark(#748198,#aab6ca)"> / 10</span></div><div class="muted">Điểm đạt: ${Number(e.passScore??5)}/10 · <b style="color:${score>=Number(e.passScore??5)?'#16855b':'#b42318'}">${score>=Number(e.passScore??5)?'ĐẠT':'CHƯA ĐẠT'}</b></div><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:25px;text-align:left"><div class="stat"><div class="stat-top">Câu đúng</div><div class="stat-value">${correct}<span style="font-size:13px">/${total}</span></div></div><div class="stat"><div class="stat-top">Thời gian làm</div><div class="stat-value">${duration}<span style="font-size:12px"> phút</span></div></div><div class="stat"><div class="stat-top">Trạng thái</div><div style="margin-top:17px">${pill('Đã nộp')}</div></div></div><div class="notice" style="text-align:left">✓ Hệ thống đã ghi nhận lượt nộp bài trong phiên xem trước. Giáo viên có thể tìm kết quả trong mục <b>Kết quả học sinh</b>.</div><button class="btn" id="studentPrintSlip">🖨️ In phiếu điểm</button> <button class="btn primary" id="backStudent">Về trang làm bài</button> <button class="btn" id="backTeacher">Xem chế độ giáo viên</button></section></div>`;$('#studentPrintSlip').onclick=()=>printScoreSlip(results[0]?.id);$('#backStudent').onclick=()=>renderStudentHome();$('#backTeacher').onclick=()=>{const u=new URL(location.href);u.searchParams.delete('mode');u.searchParams.delete('exam');history.replaceState({},'',u);$('#roleSelect').value='teacher';setPage('results')}}
$('#roleSelect').onchange=()=>{if($('#roleSelect').value==='student')renderStudentHome();else render()};$('#resetDemo').onclick=()=>{exams=structuredClone(initialExams);results=structuredClone(initialResults);nextExam=3;nextResult=10;appSettings={};persistState();activeQuiz=null;clearInterval(quizTimer);$('#roleSelect').value='teacher';setPage('dashboard');toast('Đã khôi phục dữ liệu mẫu ban đầu.')};document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action="student-return"]');if(b){const u=new URL(location.href);u.searchParams.delete('mode');u.searchParams.delete('exam');history.replaceState({},'',u);$('#roleSelect').value='teacher';setPage('dashboard')}let s=ev.target.closest('[data-action="start-quiz"]');if(s)startQuiz(s.dataset.id)});
render();
</script></body></html>
